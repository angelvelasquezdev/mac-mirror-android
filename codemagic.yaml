      tag_patterns:
        - pattern: 'v*'
          include: true
        - pattern: 'v*-beta*'
          include: false
    scripts:
      - name: Set up local.properties
        script: |
          set -e
          set -x
          
          cat <<EOF > "$CM_BUILD_DIR/local.properties"
