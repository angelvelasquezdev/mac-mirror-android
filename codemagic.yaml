workflows:
  android-internal-release:
    name: Android Internal Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - macmirror_signing_credentials
      groups:
        - google_play_credentials
        - github_credentials
      vars:
        PACKAGE_NAME: "com.angelsoft.macmirror"
    cache:
      cache_paths:
        - ~/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'develop'
          include: true
    when:
      changeset:
        includes:
          - 'app/'
          - 'gradle/'
          - 'build.gradle.kts'
          - 'settings.gradle.kts'
          - 'gradle.properties'
          - 'gradlew'
          - 'gradlew.bat'
          - 'codemagic.yaml'
    scripts:
      - name: Set up local.properties
        script: |
          set -e
          set -x
          
          cat <<EOF > "$CM_BUILD_DIR/local.properties"
          sdk.dir=$ANDROID_SDK_ROOT
          EOF
      - name: Build AAB and APK with Gradle
        script: |
          set -e
          set -x
          
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo "0")
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ] || [ "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" -eq "0" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$(($LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_STR=$(date +%Y%m%d%H%M)
          VERSION_NAME="dev.${DATE_STR}.${SHORT_SHA}"
          
          ./gradlew :app:bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode=$UPDATED_BUILD_NUMBER

          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode=$UPDATED_BUILD_NUMBER
      - name: Publish to GitHub Releases (Rolling Dev Release)
        script: |
          set -e
          set -x
          
          export GH_TOKEN="$GITHUB_TOKEN"
          COMMIT_SHA=$(git rev-parse HEAD)
          APK_PATH="app/build/outputs/apk/release/MacMirror-dev.apk"
          
          cp app/build/outputs/apk/release/app-release.apk "$APK_PATH" || cp app/build/outputs/apk/release/*.apk "$APK_PATH"
          
          # Always delete the existing dev release and tag so it is recreated completely fresh
          gh release delete dev --yes --cleanup-tag || true

          gh release create dev \
            --target "$COMMIT_SHA" \
            --title "dev" \
            --notes "Rolling pre-release build from develop branch" \
            --prerelease \
            "$APK_PATH"
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      email:
        recipients:
          - angelvelasquezdev@gmail.com
        notify:
          success: true
          failure: true

  android-beta-release:
    name: Android Beta Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - macmirror_signing_credentials
      groups:
        - google_play_credentials
        - github_credentials
      vars:
        PACKAGE_NAME: "com.angelsoft.macmirror"
    cache:
      cache_paths:
        - ~/.gradle/caches
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*-beta*'
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          set -e
          set -x
          
          cat <<EOF > "$CM_BUILD_DIR/local.properties"
          sdk.dir=$ANDROID_SDK_ROOT
          EOF
      - name: Build AAB and APK with Gradle
        script: |
          set -e
          set -x
          
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo "0")
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ] || [ "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" -eq "0" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$(($LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi
          
          BETA_VERSION_NAME=${CM_TAG#v}
          ./gradlew :app:bundleRelease \
            -PversionName="$BETA_VERSION_NAME" \
            -PversionCode=$UPDATED_BUILD_NUMBER

          ./gradlew :app:assembleRelease \
            -PversionName="$BETA_VERSION_NAME" \
            -PversionCode=$UPDATED_BUILD_NUMBER
      - name: Publish to GitHub Releases
        script: |
          set -e
          set -x
          
          if [ -z "$CM_TAG" ]; then
            echo "Not a tag build, skipping GitHub Release"
            exit 0
          fi
          
          export GH_TOKEN="$GITHUB_TOKEN"
          APK_PATH="app/build/outputs/apk/release/MacMirror-$CM_TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_PATH" || cp app/build/outputs/apk/release/*.apk "$APK_PATH"
          
          if gh release view "$CM_TAG" >/dev/null 2>&1; then
            gh release upload "$CM_TAG" "$APK_PATH" --clobber
          else
            gh release create "$CM_TAG" \
              --title "MacMirror Android $CM_TAG" \
              --generate-notes \
              --prerelease \
              "$APK_PATH"
          fi
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: beta
      email:
        recipients:
          - angelvelasquezdev@gmail.com
        notify:
          success: true
          failure: true

  android-production-release:
