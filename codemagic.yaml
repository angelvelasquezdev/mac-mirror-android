    cache:
      cache_paths:
        - ~/.gradle/caches
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*-beta*'
          include: false
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          set -e
          set -x
          
          cat <<EOF > "$CM_BUILD_DIR/local.properties"
          sdk.dir=$ANDROID_SDK_ROOT
          EOF
      - name: Build AAB with Gradle
        script: |
          set -e
