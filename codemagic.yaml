          EOF
      - name: Build AAB with Gradle
        script: |
          set -e
          set -x
          
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo "0")
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ] || [ "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" -eq "0" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$(($LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi
          
          BETA_VERSION_NAME=${CM_TAG#v}
          ./gradlew :app:bundleRelease \
            -PversionName="$BETA_VERSION_NAME" \
